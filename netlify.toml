[build.environment]
  # EMAIL_FROM_ADDRESS ist eine öffentliche Absender-Adresse, kein echtes Secret
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM_ADDRESS"

[dev]
  command = "npm run vite:dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["slicemachine.config.json"]