[build.environment]
  # INVOICE_FROM_EMAIL ist eine öffentliche Absender-Adresse, kein echtes Secret
  SECRETS_SCAN_OMIT_KEYS = "INVOICE_FROM_EMAIL"

[dev]
  command = "npm run vite:dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"